name: nmme_workflow

channels:
  - conda-forge
  - iri-nextgen

dependencies:
  # Language
  - python=3.10

  # Core scientific stack (PINNED)
  - numpy>=1.23,<2.0
  - pandas>=1.5,<2.2
  - xarray>=2023.6,<2025.0
  - cftime
  - netcdf4
  - scipy
  - dask

  # Geospatial / plotting (PINNED)
  - matplotlib
  - cartopy>=0.21,<0.24
  - shapely
  - pyproj>=3.4,<3.7

  # Utilities
  - pyyaml

  # CPT tools: avoid strict pin to avoid missing builds in available channels
  - cptio
  - cptcore
  - cptdl
  - cptextras
  - pip
  - pip:
      - xarray-spatial
      - zarr