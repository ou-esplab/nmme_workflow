<head>
 <meta content="width=device-width, initial-scale=1" name="viewport"/>
 <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
 <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body>

 <div class="container-fluid" style="margin-top:10px">
  <form id="fcstform" class="form-inline">
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselecttype">Forecast Type&nbsp;</label>
    <select class="form-control" id="fcstselecttype" onchange="onTypeChange()">
     <option value="monthly">Monthly Anomalies</option>
     <option value="tercile_probs">Seasonal Tercile Probabilities</option>
    </select>
   </div>
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselectdate">Init Date&nbsp;</label>
    <select class="form-control" id="fcstselectdate">
     <option>Latest</option>
     <option>202605</option>
    </select>
   </div>
   <div class="form-group" id="lead-group" style="margin-right:10px">
    <label for="fcstselectlead">Lead&nbsp;</label>
    <select class="form-control" id="fcstselectlead">
     <option>Month 0</option>
     <option>Month 1</option>
     <option>Month 2</option>
     <option>Month 3</option>
     <option>Month 4</option>
     <option>Month 5</option>
     <option>Month 6</option>
     <option>Month 7</option>
     <option>Month 8</option>
    </select>
   </div>
   <div class="form-group" id="season-group" style="display:none;margin-right:10px">
    <label for="fcstselectseason">Season&nbsp;</label>
    <select class="form-control" id="fcstselectseason">
     <option>MAM</option>
     <option>AMJ</option>
     <option>MJJ</option>
     <option>JJA</option>
     <option>ASO</option>
     <option>NDJ</option>
     <option>Apr-Jul</option>
     <option>Apr-Sep</option>
     <option>Oct-Jan</option>
    </select>
   </div>
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselectvar">Variable / Region&nbsp;</label>
    <select class="form-control" id="fcstselectvar"></select>
   </div>
   <button type="button" class="btn btn-primary" onclick="myFunction()">Submit</button>
  </form>
 </div>

 <div class="container-fluid" style="margin-top:10px">
  <img id="fcstImage" src="" style="max-width:100%;display:block;margin:auto"/>
 </div>

 <script>
  var monthlyVarMap = {
    "2m Temp Global":       { varPrefix: "2mTemp", fileRegion: "Global",       dirRegion: "Global" },
    "2m Temp NorthAmerica": { varPrefix: "2mTemp", fileRegion: "NorthAmerica", dirRegion: "NorthAmerica" },
    "2m Temp CONUS":        { varPrefix: "2mTemp", fileRegion: "CONUS",        dirRegion: "CONUS" },
    "2m Temp Iran":         { varPrefix: "2mTemp", fileRegion: "Iran",         dirRegion: "Iran" },
    "2m Temp Venezuela":    { varPrefix: "2mTemp", fileRegion: "Venezuela",    dirRegion: "Venezuela" },
    "2m Temp Mexico":       { varPrefix: "2mTemp", fileRegion: "Mexico",       dirRegion: "Mexico" },
    "2m Temp C.Asia":       { varPrefix: "2mTemp", fileRegion: "C.Asia",       dirRegion: "C.Asia" },
    "Precip Global":        { varPrefix: "Precip", fileRegion: "Global",       dirRegion: "Global" },
    "Precip NorthAmerica":  { varPrefix: "Precip", fileRegion: "NorthAmerica", dirRegion: "NorthAmerica" },
    "Precip CONUS":         { varPrefix: "Precip", fileRegion: "CONUS",        dirRegion: "CONUS" },
    "Precip Iran":          { varPrefix: "Precip", fileRegion: "Iran",         dirRegion: "Iran" },
    "Precip Venezuela":     { varPrefix: "Precip", fileRegion: "Venezuela",    dirRegion: "Venezuela" },
    "Precip Mexico":        { varPrefix: "Precip", fileRegion: "Mexico",       dirRegion: "Mexico" },
    "Precip C.Asia":        { varPrefix: "Precip", fileRegion: "C.Asia",       dirRegion: "C.Asia" },
    "SST Global":           { varPrefix: "SST",    fileRegion: "Global",       dirRegion: "Global" }
  };

  var seasonalVarOptions = [
    "Precip CONUS", "Precip Mexico", "Precip Iran", "Precip Venezuela", "Precip C.Asia",
    "Temp CONUS",   "Temp Mexico",   "Temp Iran",   "Temp Venezuela",   "Temp C.Asia"
  ];

  var seasonalVarMap = {
    "Precip CONUS":     { varName: "prec", region: "CONUS" },
    "Precip Mexico":    { varName: "prec", region: "Mexico" },
    "Precip Iran":      { varName: "prec", region: "Iran" },
    "Precip Venezuela": { varName: "prec", region: "Venezuela" },
    "Precip C.Asia":    { varName: "prec", region: "C.Asia" },
    "Temp CONUS":       { varName: "tref", region: "CONUS" },
    "Temp Mexico":      { varName: "tref", region: "Mexico" },
    "Temp Iran":        { varName: "tref", region: "Iran" },
    "Temp Venezuela":   { varName: "tref", region: "Venezuela" },
    "Temp C.Asia":      { varName: "tref", region: "C.Asia" }
  };

  function onTypeChange() {
    var type = document.getElementById("fcstselecttype").value;
    var isMonthly = (type === "monthly");
    document.getElementById("lead-group").style.display   = isMonthly ? "" : "none";
    document.getElementById("season-group").style.display = isMonthly ? "none" : "";
    var varSelect = document.getElementById("fcstselectvar");
    var options = isMonthly ? Object.keys(monthlyVarMap) : seasonalVarOptions;
    varSelect.innerHTML = "";
    options.forEach(function(o) {
      var opt = document.createElement("option");
      opt.text = o;
      varSelect.add(opt);
    });
  }

  function resolveLatestDate() {
    var sel = document.getElementById("fcstselectdate");
    var latest = "";
    for (var i = 0; i < sel.options.length; i++) {
      var v = sel.options[i].value.trim();
      if (/^\d{6}$/.test(v) && (latest === "" || v > latest)) latest = v;
    }
    return latest;
  }

  function buildImagePath() {
    var type        = document.getElementById("fcstselecttype").value;
    var date        = document.getElementById("fcstselectdate").value.trim();
    var varReg      = document.getElementById("fcstselectvar").value.trim();
    var resolvedDate = (date === "Latest") ? resolveLatestDate() : date;

    if (type === "monthly") {
      var lead    = document.getElementById("fcstselectlead").value.trim();
      var leadNum = lead.replace(/[^\d]/g, "");
      var m = monthlyVarMap[varReg];
      if (!m) return null;
      return "images/" + resolvedDate + "/monthly/" + m.dirRegion + "/" +
             m.varPrefix + m.fileRegion + "Month" + leadNum + ".png";
    } else {
      var season = document.getElementById("fcstselectseason").value.trim();
      var s = seasonalVarMap[varReg];
      if (!s) return null;
      return "images/" + resolvedDate + "/seasonal/" + s.region + "/" +
             "NMME_" + resolvedDate + "_" + s.region + "_" + season + "_" + s.varName + "_tercile_probs.png";
    }
  }

  function myFunction() {
    var path = buildImagePath();
    if (!path) { alert("Invalid selection."); return; }
    var img = document.getElementById("fcstImage");
    var tmp = new Image();
    tmp.onload  = function() { img.src = path; img.alt = ""; };
    tmp.onerror = function() {
      img.src = "";
      img.alt = "Forecast image not available for this selection.";
      alert("Forecast map not available for this date/variable combination.");
    };
    tmp.src = path;
  }

  window.addEventListener("load", function() {
    onTypeChange();
    myFunction();
  });
 </script>

 <div class="container" style="margin-top:20px">
  <div class="row">
   <div class="col-xs-10">
    <p><i>
     Disclaimer: These are experimental forecasts produced from the NMME. These are not official
     forecasts and are not guaranteed to be timely or accurate. For official monthly and seasonal
     outlooks, go to the <a href="http://www.cpc.noaa.gov/">NOAA/NWS Climate Prediction Center</a>.
    </i></p>
   </div>
  </div>
 </div>
</body>
