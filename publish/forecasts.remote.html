<head>
 <meta content="width=device-width, initial-scale=1" name="viewport"/>
 <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet"/>
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
 <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>
<body>

 <div class="container-fluid" style="margin-top:10px">
  <form id="fcstform" class="form-inline">
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselecttype">Forecast Type&nbsp;</label>
    <select class="form-control" id="fcstselecttype" onchange="onTypeChange()">
     <option value="monthly">Monthly Anomalies</option>
     <option value="tercile_probs">Seasonal Tercile Probabilities</option>
     <option value="cpt_dominant">Combined Tercile Probabilities</option>
    </select>
   </div>
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselectdate">Init Date&nbsp;</label>
    <select class="form-control" id="fcstselectdate">
     <option>Latest</option>
     <option>202605</option>
    </select>
   </div>
   <div class="form-group" id="lead-group" style="margin-right:10px">
    <label for="fcstselectlead">Lead&nbsp;</label>
    <select class="form-control" id="fcstselectlead">
     <option>Month 0</option>
     <option>Month 1</option>
     <option>Month 2</option>
     <option>Month 3</option>
     <option>Month 4</option>
     <option>Month 5</option>
     <option>Month 6</option>
     <option>Month 7</option>
     <option>Month 8</option>
    </select>
   </div>
   <div class="form-group" id="season-group" style="display:none;margin-right:10px">
    <label for="fcstselectseason">Season&nbsp;</label>
    <select class="form-control" id="fcstselectseason">
     <option>MAM</option>
     <option>AMJ</option>
     <option>MJJ</option>
     <option>JJA</option>
     <option>ASO</option>
     <option>NDJ</option>
     <option>Apr-Jul</option>
     <option>Apr-Sep</option>
     <option>Oct-Jan</option>
    </select>
   </div>
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselectvar">Variable&nbsp;</label>
    <select class="form-control" id="fcstselectvar" onchange="onVarChange()"></select>
   </div>
   <div class="form-group" style="margin-right:10px">
    <label for="fcstselectregion">Region&nbsp;</label>
    <select class="form-control" id="fcstselectregion"></select>
   </div>
   <button type="button" class="btn btn-primary" onclick="myFunction()">Submit</button>
  </form>
 </div>

 <div class="container-fluid" style="margin-top:10px">
  <img id="fcstImage" src="" style="max-width:100%;display:block;margin:auto"/>
 </div>

 <script>
  // Monthly: variable -> { varPrefix, regions[] }
  var monthlyVars = {
    "2m Temp": { varPrefix: "2mTemp", regions: ["Global","NorthAmerica","CONUS","Iran","Venezuela","Mexico","C.Asia"] },
    "Precip":  { varPrefix: "Precip", regions: ["Global","NorthAmerica","CONUS","Iran","Venezuela","Mexico","C.Asia"] },
    "SST":     { varPrefix: "SST",    regions: ["Global"] }
  };

  // Seasonal: variable -> varName
  var seasonalVars = {
    "Precipitation": "prec",
    "Temperature":   "tref"
  };

  var seasonalRegions = ["CONUS", "Mexico", "Iran", "Venezuela", "C.Asia"];

  function populateSelect(id, options) {
    var sel = document.getElementById(id);
    sel.innerHTML = "";
    options.forEach(function(o) {
      var opt = document.createElement("option");
      opt.text = o; opt.value = o;
      sel.add(opt);
    });
  }

  function onTypeChange() {
    var type = document.getElementById("fcstselecttype").value;
    var isMonthly = (type === "monthly");
    document.getElementById("lead-group").style.display   = isMonthly ? "" : "none";
    document.getElementById("season-group").style.display = isMonthly ? "none" : "";
    populateSelect("fcstselectvar", isMonthly ? Object.keys(monthlyVars) : Object.keys(seasonalVars));
    onVarChange();
  }

  function onVarChange() {
    var type = document.getElementById("fcstselecttype").value;
    var varVal = document.getElementById("fcstselectvar").value;
    if (type === "monthly") {
      var regions = (monthlyVars[varVal] || monthlyVars["Precip"]).regions;
      populateSelect("fcstselectregion", regions);
    } else {
      populateSelect("fcstselectregion", seasonalRegions);
    }
  }

  function resolveLatestDate() {
    var sel = document.getElementById("fcstselectdate");
    var latest = "";
    for (var i = 0; i < sel.options.length; i++) {
      var v = sel.options[i].value.trim();
      if (/^\d{6}$/.test(v) && (latest === "" || v > latest)) latest = v;
    }
    return latest;
  }

  function buildImagePath() {
    var type         = document.getElementById("fcstselecttype").value;
    var date         = document.getElementById("fcstselectdate").value.trim();
    var varVal       = document.getElementById("fcstselectvar").value.trim();
    var region       = document.getElementById("fcstselectregion").value.trim();
    var resolvedDate = (date === "Latest") ? resolveLatestDate() : date;

    if (type === "monthly") {
      var lead    = document.getElementById("fcstselectlead").value.trim();
      var leadNum = lead.replace(/[^\d]/g, "");
      var cfg = monthlyVars[varVal];
      if (!cfg) return null;
      return "images/" + resolvedDate + "/monthly/" + region + "/" +
             cfg.varPrefix + region + "Month" + leadNum + ".png";
    } else {
      var season  = document.getElementById("fcstselectseason").value.trim();
      var varName = seasonalVars[varVal];
      if (!varName) return null;
      if (type === "tercile_probs") {
        return "images/" + resolvedDate + "/seasonal/" + region + "/" +
               "NMME_" + resolvedDate + "_" + region + "_" + season + "_" + varName + "_tercile_probs.png";
      } else {
        return "images/" + resolvedDate + "/seasonal/cpt_dominant/" + region + "/" +
               "NMME_" + resolvedDate + "_" + region + "_" + season + "_" + varName + "_cpt_dominant.png";
      }
    }
  }

  function myFunction() {
    var path = buildImagePath();
    if (!path) { alert("Invalid selection."); return; }
    var img = document.getElementById("fcstImage");
    var tmp = new Image();
    tmp.onload  = function() { img.src = path; img.alt = ""; };
    tmp.onerror = function() {
      img.src = "";
      img.alt = "Forecast image not available for this selection.";
      alert("Forecast map not available for this date/variable combination.");
    };
    tmp.src = path;
  }

  window.addEventListener("load", function() {
    onTypeChange();
    myFunction();
  });
 </script>

 <div class="container" style="margin-top:20px">
  <div class="row">
   <div class="col-xs-10">
    <p><i>
     Disclaimer: These are experimental forecasts produced from the NMME. These are not official
     forecasts and are not guaranteed to be timely or accurate. For official monthly and seasonal
     outlooks, go to the <a href="http://www.cpc.noaa.gov/">NOAA/NWS Climate Prediction Center</a>.
    </i></p>
   </div>
  </div>
 </div>
</body>
