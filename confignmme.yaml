# ============================================================
# NMME + PyCPT Workflow Configuration (CLEAN BASELINE)
# ============================================================

# ------------------------------------------------------------
# Models (single source of truth)
# ------------------------------------------------------------
models:
  - NASA-GEOSS2S
  - CanESM5
  - GEM5.2-NEMO
  - NCEP-CFSv2
  - COLA-RSMAS-CCSM4


# ------------------------------------------------------------
# PyCPT Regions
# ------------------------------------------------------------
pycpt_regions:
  - name: Mexico
    lat: [20, 33]
    lon: [-118, -97]
    season: Feb-Apr

  - name: Iran
    lat: [24, 40]
    lon: [40, 64]
    season: Feb-Apr

  - name: Venezuela
    lat: [0, 13]
    lon: [-73, -60]
    season: Feb-Apr


# ------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------
data:

  # Switch between local data and download-based workflows
  local:
    enabled: true

    # Base directory for all locally stored NMME/PyCPT inputs
    root: /data/esplab/nmme-backup

    # Observations / predictand
    predictand:
      dir: /data/esplab/shared/obs/gridded/atm/precip/daily/chirps-v2.0/p05
      var: precip

    # Variable names used in model files
    model_vars:
      precipitation: pr

    # Mapping from YAML model IDs → local directory names
    # Required only when local directory names differ from model IDs
    model_base:
      NASA-GEOSS2S: GEOSS2S
      CanESM5: CanESM5
      GEM5.2-NEMO: GEM5.2-NEMO
      NCEP-CFSv2: CFSv2
      COLA-RSMAS-CCSM4: CCSM4


  # Output locations
  output:
    pycpt: /data/esplab/shared/model/initialized/nmme/forecast/pycpt
    nmme_monthly: /data/esplab/shared/model/initialized/nmme/forecast/monthly
    nmme_seasonal: /data/esplab/shared/model/initialized/nmme/forecast/seasonal


# ------------------------------------------------------------
# Runtime Environments
# ------------------------------------------------------------
environments:
  nmme: subxnmme
  pycpt: pycpt-2.8.2


# ------------------------------------------------------------
# Pipeline Behavior
# ------------------------------------------------------------
pipeline:
  run_pycpt: true
  run_nmme_fcst_plots: true


# ------------------------------------------------------------
# Logging & Retention
# ------------------------------------------------------------
logging:
  directory: ./logs/
  keep_days: 30