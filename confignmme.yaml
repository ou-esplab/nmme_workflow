# ============================================================
# NMME + PyCPT Workflow Configuration (CLEAN BASELINE)
# ============================================================

# ------------------------------------------------------------
# Models (single source of truth)
# ------------------------------------------------------------
models:
  - NASA-GEOSS2S
  - CanESM5
  - GEM5.2-NEMO
  - NCEP-CFSv2
  - COLA-RSMAS-CCSM4
  - COLA-RSMAS-CESM1
  - NOAA-SFS


# ------------------------------------------------------------
# PyCPT Regions
# ------------------------------------------------------------
pycpt_regions:
  - name: Mexico
    lat: [20, 33]
    lon: [-118, -97]
    season: Feb-Apr
    models:
      - NASA-GEOSS2S
      - CanESM5
      - GEM5.2-NEMO
      - NCEP-CFSv2
      - COLA-RSMAS-CCSM4
      - COLA-RSMAS-CESM1

  - name: Iran
    lat: [24, 40]
    lon: [40, 64]
    season: Feb-Apr

  - name: Venezuela
    lat: [0, 13]
    lon: [-73, -60]
    season: Feb-Apr


# ------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------
data:
  local:
    enabled: true
    root: /data/esplab/nmme-backup
    preprocess_root: /data/esplab/shared/model/initialized/nmme/forecast/monthly

    predictand:
      dir: /data/esplab/shared/obs/gridded/atm/precip/daily/chirps-v2.0/p25
      var: precip

    # The variable name used in your model NetCDF directory & file prefix
    model_vars:
      precipitation: prec

    # Only needed if some models use a different folder name than the YAML ID
    # If your folders match the IDs, you can delete this entire block.
    model_base:
      NASA-GEOSS2S: NASA-GEOSS2S
      CanESM5: CanESM5
      GEM5.2-NEMO: GEM5.2-NEMO
      NCEP-CFSv2: NCEP-CFSv2
      COLA-RSMAS-CCSM4: COLA-RSMAS-CCSM4
      COLA-RSMAS-CESM1: COLA-RSMAS-CESM1
      NOAA-SFS: NOAA-SFS

    path_patterns:
      # Hindcasts live across many years -> use wildcards for yyyy/mm
      hindcast: "{root}/{model}/hindcast/{var}/{var}_{model}_????_??.nc"

      # Forecast lives for one init -> keep date-specific pattern
      forecast: "{root}/{model}/forecast/{var}/{var}_{model}_{yyyy}_{mm}.nc"

  # Output locations
  output:
    pycpt: /data/esplab/shared/model/initialized/nmme/forecast/pycpt
    nmme_monthly: /data/esplab/shared/model/initialized/nmme/forecast/monthly
    nmme_seasonal: /data/esplab/shared/model/initialized/nmme/forecast/seasonal


# ------------------------------------------------------------
# Runtime Environments
# ------------------------------------------------------------
environments:
  nmme: subxnmme
  pycpt: pycpt-2.8.2


# ------------------------------------------------------------
# Pipeline Behavior
# ------------------------------------------------------------
pipeline:
  run_pycpt: true
  run_nmme_fcst_plots: true
  sfs:
    enabled: true
    dry_run: false
    variables: "prec tref sst"
    reforecast_enabled: true
    reforecast_dry_run: false
    reforecast_script: ./download_sfs_reforecast_prec.sh
    reforecast_root: s3://noaa-oar-sfsdev-pds/experiments/beta1/reforecast
    reforecast_months: ""
    reforecast_start_year: 1991
    reforecast_end_year: 2100
    reforecast_max_downloads: 0
    climo_enabled: true
    climo_python: python3
    climo_script: ./make_sfs_climo_from_reforecast.py
    climo_input_dir: /data/esplab/nmme-backup/NOAA-SFS/reforecast  # base dir; per-var subdir appended at runtime
    climo_output_dir: /data/esplab/shared/model/initialized/nmme/climatology/monthly/1991-2020
    climo_start_year: 1991
    climo_end_year: 2020
  publish:
    enabled: true
    dry_run: false
    copy_monthly: true
    copy_seasonal: true
    copy_latest: true
    update_html: true
    dest_host: somclass23.som.nor.ou.edu
    dest_dir: /home/kpegion/http/nmme/forecasts
    ssh_key: ~/.ssh/id_ed25519


# ------------------------------------------------------------
# Logging & Retention
# ------------------------------------------------------------
logging:
  directory: ./logs/
  keep_days: 30


# ------------------------------------------------------------
# Plotting
# ------------------------------------------------------------
plotting:
  land_ocean_mask: /data/esplab/shared/model/initialized/nmme/hindcast/monthly/land_cover.nc
