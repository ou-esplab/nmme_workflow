# ============================================================
# NMME + PyCPT Workflow Configuration (CLEAN BASELINE)
# ============================================================

# ------------------------------------------------------------
# Models (single source of truth)
# ------------------------------------------------------------
models:
  - NASA-GEOSS2S
  - CanESM5
  - GEM5.2-NEMO
  - NCEP-CFSv2
  - COLA-RSMAS-CCSM4
  - COLA-RSMAS-CESM1
  - NOAA-SFS


# ------------------------------------------------------------
# Forecast Regions
# Defines regions and seasons for NMME tercile probability products.
# PyCPT uses these same lat/lon bounds plus its own season string below.
# ------------------------------------------------------------
regions:
  - name: CONUS
    lat: [24, 50]
    lon: [-125, -66]
    seasons: [MAM, AMJ, MJJ, JJA, ASO, NDJ, Apr-Jul, Apr-Sep, Oct-Jan]
    plot: {clon: 262.5, mproj: pcarree, state_colors: k}

  - name: Mexico
    lat: [20, 33]
    lon: [-118, -97]
    seasons: [MAM, AMJ, MJJ, JJA, ASO, NDJ, Apr-Jul, Apr-Sep, Oct-Jan]
    plot: {clon: 252.5, mproj: pcarree, state_colors: gray}

  - name: Iran
    lat: [24, 40]
    lon: [40, 64]
    seasons: [MAM, AMJ, MJJ, JJA, ASO, NDJ, Apr-Jul, Apr-Sep, Oct-Jan]
    plot: {clon: 52, mproj: pcarree, state_colors: gray}

  - name: Venezuela
    lat: [0, 13]
    lon: [-73, -60]
    seasons: [MAM, AMJ, MJJ, JJA, ASO, NDJ, Apr-Jul, Apr-Sep, Oct-Jan]
    plot: {clon: 293.5, mproj: pcarree, state_colors: gray}

  - name: C.Asia
    lat: [28.39, 55.55]
    lon: [45.53, 88.33]
    seasons: [MAM, AMJ, MJJ, JJA, ASO, NDJ, Apr-Jul, Apr-Sep, Oct-Jan]
    plot: {clon: 67, mproj: pcarree, state_colors: gray}

# ------------------------------------------------------------
# PyCPT Configuration (used when pycpt stage is active)
# ------------------------------------------------------------
pycpt:
  # Variables to bias-correct. Each entry must have a matching key
  # under data.local.model_vars and data.local.predictands.
  variables:
    - var: prec
      lev: sfc

  # CPT CCA settings (passed directly to canonical_correlation_analysis)
  cpt_args:
    tailoring: Anomaly
    cca_modes: [1, 3]
    x_eof_modes: [1, 8]
    y_eof_modes: [1, 6]
    validation: crossvalidation
    crossvalidation_window: 5
    synchronous_predictors: true

  # Per-region entries. lat/lon/seasons come from the top-level regions: block.
  # Add models: override here to restrict which models run for a region.
  regions:
    - name: Mexico

    - name: CONUS

    - name: Iran

    - name: Venezuela

    - name: C.Asia


# ------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------
data:
  local:
    enabled: true
    root: /data/esplab/nmme-backup
    preprocess_root: /data/esplab/shared/model/initialized/nmme/forecast/monthly

    predictand:
      dir: /data/esplab/shared/obs/gridded/atm/precip/daily/chirps-v2.0/p25
      var: precip

    # The variable name used in your model NetCDF directory & file prefix
    model_vars:
      precipitation: prec

    # Only needed if some models use a different folder name than the YAML ID
    # If your folders match the IDs, you can delete this entire block.
    model_base:
      NASA-GEOSS2S: NASA-GEOSS2S
      CanESM5: CanESM5
      GEM5.2-NEMO: GEM5.2-NEMO
      NCEP-CFSv2: NCEP-CFSv2
      NCAR-CESM1: NCAR-CESM1
      COLA-RSMAS-CCSM4: COLA-RSMAS-CCSM4
      COLA-RSMAS-CESM1: COLA-RSMAS-CESM1
      NOAA-SFS: NOAA-SFS

    path_patterns:
      # Hindcasts live across many years -> use wildcards for yyyy/mm
      hindcast: "{root}/{model}/hindcast/{var}/{var}_{model}_????_??.nc"

      # Forecast lives for one init -> keep date-specific pattern
      forecast: "{root}/{model}/forecast/{var}/{var}_{model}_{yyyy}_{mm}.nc"

  # Output locations
  output:
    pycpt: /data/esplab/shared/model/initialized/nmme/forecast/pycpt
    nmme_forecast: /data/esplab/shared/model/initialized/nmme/forecast


# ------------------------------------------------------------
# Runtime Environments
# ------------------------------------------------------------
environments:
  nmme: subxnmme
  pycpt: pycpt-2.8.2


# ------------------------------------------------------------
# Pipeline Behavior
# ------------------------------------------------------------
pipeline:
  run_pycpt: true
  run_nmme_fcst_plots: true
  log_level: info
  sfs:
    enabled: true
    dry_run: false
    variables: "prec tref sst u10m v10m ssu ssv"
    reforecast_enabled: true
    reforecast_dry_run: false
    reforecast_script: ./ingest/download_sfs_reforecast_prec.sh
    reforecast_root: s3://noaa-oar-sfsdev-pds/experiments/beta1/reforecast
    reforecast_months: ""
    reforecast_start_year: 1991
    reforecast_end_year: 2100
    reforecast_max_downloads: 0
    climo_enabled: true
    climo_python: /home/kpegion/miniconda3/envs/nmme_workflow_env/bin/python3
    climo_script: ./static/make_sfs_climo_from_reforecast.py
    climo_input_dir: /data/esplab/nmme-backup/NOAA-SFS/reforecast  # base dir; per-var subdir appended at runtime
    climo_output_dir: /data/esplab/shared/model/initialized/nmme/climatology/monthly/1991-2020
    climo_start_year: 1991
    climo_end_year: 2020
  publish:
    enabled: true
    dry_run: false
    copy_monthly: true
    copy_seasonal: true
    copy_latest: true
    update_html: true
    dest_host: somclass23
    dest_dir: /data/web/kpegion/http/nmme/forecasts_test
    ssh_key: ~/.ssh/id_ed25519
    copy_static_once: true
    copy_static_force: false
    copy_html_force: false
    static_climatology_source: /data/esplab/shared/model/initialized/nmme/climatology/monthly/1991-2020
    static_terciles_source: /data/esplab/shared/model/initialized/nmme/terciles/1991-2020
    hindcasts_dest_dir: /data/web/kpegion/http/nmme/hindcasts_test


# ------------------------------------------------------------
# Arraylake Append
# ------------------------------------------------------------
arraylake:
  enabled: false
  repo: ou-subc/nmme-forecasts
  branch: main
  input_root: /data/esplab/nmme-backup
  datatype: forecast
  variables: [prec, tref, sst, h200, h500]
  skip_models: []
  model_vars: {}


# ------------------------------------------------------------
# Logging & Retention
# ------------------------------------------------------------
logging:
  directory: ./logs/
  keep_days: 30


# ------------------------------------------------------------
# Plotting
# ------------------------------------------------------------
plotting:
  land_ocean_mask: /data/esplab/shared/model/initialized/nmme/hindcast/monthly/land_cover.nc
