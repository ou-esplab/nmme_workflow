# ============================================================
# NMME + PyCPT Workflow Configuration (CLEAN BASELINE)
# ============================================================

# ------------------------------------------------------------
# Models (single source of truth)
# ------------------------------------------------------------
models:
  - NASA-GEOSS2S
  - CanESM5
  - GEM5.2-NEMO
  - NCEP-CFSv2
  - COLA-RSMAS-CCSM4


# ------------------------------------------------------------
# PyCPT Regions
# ------------------------------------------------------------
pycpt_regions:
  - name: Mexico
    lat: [20, 33]
    lon: [-118, -97]
    season: Feb-Apr
    models:
      - NASA-GEOSS2S

  - name: Iran
    lat: [24, 40]
    lon: [40, 64]
    season: Feb-Apr

  - name: Venezuela
    lat: [0, 13]
    lon: [-73, -60]
    season: Feb-Apr


# ------------------------------------------------------------
# Data Sources
# ------------------------------------------------------------
data:
  local:
    enabled: true
    root: /data/esplab/nmme-backup

    predictand:
      dir: /data/esplab/shared/obs/gridded/atm/precip/daily/chirps-v2.0/p25
      var: precip

    # The variable name used in your model NetCDF directory & file prefix
    model_vars:
      precipitation: prec

    # Only needed if some models use a different folder name than the YAML ID
    # If your folders match the IDs, you can delete this entire block.
    model_base:
      NASA-GEOSS2S: NASA-GEOSS2S
      CanESM5: CanESM5
      GEM5.2-NEMO: GEM5.2-NEMO
      NCEP-CFSv2: NCEP-CFSv2
      COLA-RSMAS-CCSM4: COLA-RSMAS-CCSM4

    path_patterns:
      # Hindcasts live across many years -> use wildcards for yyyy/mm
      hindcast: "{root}/{model}/hindcast/{var}/{var}_{model}_????_??.nc"

      # Forecast lives for one init -> keep date-specific pattern
      forecast: "{root}/{model}/forecast/{var}/{var}_{model}_{yyyy}_{mm}.nc"

  # Output locations
  output:
    pycpt: /data/esplab/shared/model/initialized/nmme/forecast/pycpt
    nmme_monthly: /data/esplab/shared/model/initialized/nmme/forecast/monthly
    nmme_seasonal: /data/esplab/shared/model/initialized/nmme/forecast/seasonal


# ------------------------------------------------------------
# Runtime Environments
# ------------------------------------------------------------
environments:
  nmme: subxnmme
  pycpt: pycpt-2.8.2


# ------------------------------------------------------------
# Pipeline Behavior
# ------------------------------------------------------------
pipeline:
  run_pycpt: true
  run_nmme_fcst_plots: true


# ------------------------------------------------------------
# Logging & Retention
# ------------------------------------------------------------
logging:
  directory: ./logs/
  keep_days: 30